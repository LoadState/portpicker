name: Build PortPicker.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt pyinstaller
      - name: Test
        shell: bash
        run: |
          python -m pip install pytest
          curl -sSfL -o "$RUNNER_TEMP/ports.json" https://github.com/PortsMaster/PortMaster-New/releases/latest/download/ports.json || true
          PORTS_JSON="$RUNNER_TEMP/ports.json" python -m pytest -q tests
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PortPicker app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PortPicker
          path: dist/PortPicker.exe
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PortPicker.exe
